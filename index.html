<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EO Technics — Wafer Laser Via Health Check Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --neon-blue: #00d4ff;
      --neon-purple: #a855f7;
      --neon-green: #22c55e;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --dark-900: #0f172a;
    }
    body { background: var(--dark-900); color: #e2e8f0; }
    .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); }
    .text-neon-blue { color: var(--neon-blue); }
    .text-neon-purple { color: var(--neon-purple); }
    .text-neon-green { color: var(--neon-green); }
    .text-neon-amber { color: var(--neon-amber); }
    .text-neon-red { color: var(--neon-red); }
    .bg-neon-blue { background-color: var(--neon-blue); }
    .bg-neon-purple { background-color: var(--neon-purple); }
    .bg-neon-green { background-color: var(--neon-green); }
    .bg-neon-amber { background-color: var(--neon-amber); }
    .bg-neon-red { background-color: var(--neon-red); }
    .border-neon-blue { border-color: var(--neon-blue); }
    .border-neon-purple { border-color: var(--neon-purple); }
    .border-neon-green { border-color: var(--neon-green); }
    .border-neon-amber { border-color: var(--neon-amber); }
    .border-neon-red { border-color: var(--neon-red); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; }
    .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
    .severity-critical { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .severity-warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
    .machine-seq-badge { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .timeline-line { position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.1); }
    .visit-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; background: rgba(30,41,59,0.4); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-scheduled { background: #64748b; }
    .status-completed { background: var(--neon-green); }
    .status-progress { background: var(--neon-amber); }
    .machine-badge { padding: 2px 8px; border-radius: 6px; }
    .quarter-block { background: rgba(30,41,59,0.4); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .param-edit-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .param-edit-input { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 10px; color: white; font-size: 12px; }
    .param-edit-select { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 10px; color: white; font-size: 12px; }
    .spare-edit-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .spare-edit-input { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 10px; color: white; font-size: 12px; }
    .spare-edit-select { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 10px; color: white; font-size: 12px; }
    .edit-input { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: white; font-size: 13px; width: 100%; }
    .edit-textarea { background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: white; font-size: 13px; width: 100%; resize: vertical; }
    .edit-label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .image-upload-slot { background: rgba(30,41,59,0.4); border: 2px dashed rgba(255,255,255,0.1); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; min-height: 120px; }
    .image-upload-slot:hover { border-color: var(--neon-blue); background: rgba(0,212,255,0.05); }
    .image-upload-slot.has-image { border-style: solid; border-color: var(--neon-green); }
    .btn-sm { padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; }
    .btn-danger { background: rgba(239,68,68,0.2); color: var(--neon-red); }
    .btn-danger:hover { background: rgba(239,68,68,0.3); }
    .btn-add { background: rgba(34,197,94,0.2); color: var(--neon-green); }
    .btn-add:hover { background: rgba(34,197,94,0.3); }
    .report-preview { background: white; color: #0f172a; }
    @media print { body * { visibility: hidden; } .report-preview, .report-preview * { visibility: visible; } .report-preview { position: absolute; left: 0; top: 0; width: 100%; } }
  </style>
</head>
<body class="min-h-screen">
  <!-- Main entry point — loads as ES module -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
